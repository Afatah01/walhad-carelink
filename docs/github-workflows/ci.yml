# Typecheck, unit tests and a production build on every push and pull request.
# Free on public repositories and well inside the 2,000 minutes/month allowance
# on private ones.
#
# This file lives in docs/ because a personal access token without the
# `workflow` scope cannot create files under .github/workflows/. To activate it,
# copy it into .github/workflows/ci.yml in the GitHub web editor.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build-time only; the app does not touch the database during a build.
          APP_SECRET: ci-placeholder-secret-not-used-for-anything-real
          APP_BASE_URL: http://localhost:3000
          SEED_DEMO: "false"
