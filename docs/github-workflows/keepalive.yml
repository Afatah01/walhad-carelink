# Keeps a free Render web service warm and lets the app do its own scheduled work.
#
# Why this exists: Render's free tier has no cron jobs, and a free web service
# spins down after 15 minutes without inbound traffic. Pinging every 5 minutes
# keeps it awake and gives the lazy sync in src/lib/boot.ts an opportunity to
# pull fresh readings and fire alerts — the job a cron job would otherwise do.
#
# This file lives in docs/ because a personal access token without the
# `workflow` scope cannot create files under .github/workflows/. To activate it,
# copy it into .github/workflows/keepalive.yml in the GitHub web editor (the
# browser UI is not subject to token scopes), or push it with a token that has
# the `workflow` scope.
#
# Setup (2 minutes, no credit card):
#   1. Note your Render URL, e.g. https://walhad-carelink.onrender.com
#   2. Either edit DEFAULT_URL below, or add a repository secret named APP_URL
#      (Settings → Secrets and variables → Actions) to override it.
#   3. GitHub → Actions tab → "Keep-alive" → Enable workflow.
#
# Note: GitHub disables scheduled workflows after 60 days of repository
# inactivity. Push anything and they resume (or re-enable from the Actions tab).
#
# Important: this is a demo convenience, not a production pattern. GitHub's
# scheduler can be delayed by several minutes under load, so treat the interval
# as approximate. Render's own docs say free instances are not for production.

name: Keep-alive

on:
  schedule:
    # Every 5 minutes. GitHub runs scheduled jobs on a best-effort basis.
    - cron: "*/5 * * * *"
  workflow_dispatch: # lets you trigger it manually from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the service
        env:
          APP_URL_SECRET: ${{ secrets.APP_URL }}
          DEFAULT_URL: https://walhad-carelink.onrender.com
        run: |
          URL="${APP_URL_SECRET:-$DEFAULT_URL}"
          if [ -z "$URL" ]; then
            echo "::error::Set DEFAULT_URL in this file or add an APP_URL repository secret."
            exit 1
          fi
          URL="${URL%/}"
          echo "Pinging $URL/api/keepalive"
          # Cold start can take ~60s, so allow generous timeouts and retry once.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
            "$URL/api/keepalive" || echo "000")
          echo "HTTP $code"
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::warning::Unexpected status $code — the service may still be starting."
          fi

      - name: Report health
        if: always()
        env:
          APP_URL_SECRET: ${{ secrets.APP_URL }}
          DEFAULT_URL: https://walhad-carelink.onrender.com
        run: |
          URL="${APP_URL_SECRET:-$DEFAULT_URL}"
          URL="${URL%/}"
          curl -s --max-time 60 "$URL/api/health" | head -c 600 || true
          echo
