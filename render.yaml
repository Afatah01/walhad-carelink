# Render.com blueprint — FREE TIER
#
#   Hobby workspace, no credit card. What that means in practice:
#
#   • Web service: 512 MB / 0.1 CPU, spins down after 15 min idle, ~1 min cold start
#   • Postgres: free for 30 days from creation, 1 GB, then deleted after a 14-day
#     grace period unless upgraded. See "The 30-day database problem" in DEPLOY.md.
#   • No cron jobs and no background workers on Free, so the app syncs itself on
#     wake-up instead (src/lib/boot.ts) and a free uptime pinger keeps it warm.
#
#   Nothing here is paid. To make it production-grade later, add a `plan:` line to
#   the service (starter) and the database (basic-256mb) — nothing else changes.

services:
  - type: web
    name: walhad-carelink
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    # The app migrates, seeds and refreshes itself on the first request, so the
    # start command stays a plain `next start` — no build-time database access,
    # which a free Postgres cannot support during a build.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: walhad-carelink-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: PG_POOL_MAX
        value: "3"
      # Render injects RENDER_EXTERNAL_URL; APP_BASE_URL is only needed for deep
      # links and webhook registration, where the exact host matters.
      - key: APP_BASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      # How old demo readings may get before the next request refreshes them.
      - key: DEMO_REFRESH_MINUTES
        value: "10"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: PAYMENT_CHECKOUT_URL
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_PHONE
        sync: false
      - key: CONTACT_ADDRESS
        sync: false
      - key: CONTACT_HOURS
        sync: false

databases:
  - name: walhad-carelink-db
    databaseName: walhad_carelink
    user: walhad
    plan: free
    postgresMajorVersion: "16"
