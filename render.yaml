# Render.com blueprint — one web service plus a managed Postgres database.
#
#   1. Push this repository to GitHub.
#   2. In Render: New + → Blueprint → pick the repo.
#   3. Fill in the secret values marked `sync: false` (Telegram token, VAPID
#      keys, SMS credentials, payment webhook secret, contact details).
#
# The app also runs without Postgres (SQLite file) for a quick preview, but a
# database is required for anything beyond evaluation.

databases:
  - name: walhad-carelink-db
    databaseName: walhad_carelink
    user: walhad
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: walhad-carelink
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: walhad-carelink-db
          property: connectionString
      - key: PGSSL
        value: "true"
      # Render injects RENDER_EXTERNAL_URL; the app falls back to it for HTTPS links
      - key: APP_BASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: PAYMENT_CHECKOUT_URL
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_PHONE
        sync: false
      - key: CONTACT_ADDRESS
        sync: false
      - key: CONTACT_HOURS
        sync: false
